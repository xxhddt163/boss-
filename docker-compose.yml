# ========================================================
# 冒险岛驮狼雪人 Boss 刷新时间管理系统
# 单容器直连模式 (无需 Nginx 反向代理，Node.js 原生运行 HTTPS + WSS)
# ========================================================

services:
  snowman-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snowman-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 核心服务主端口 (默认 443 监听 HTTPS 安全连接)
      - PORT=443
      # SSL 证书与私钥路径 (由 volumes 挂载宿主机 ./certs 目录)
      - SSL_CERT_PATH=/app/certs/server.crt
      - SSL_KEY_PATH=/app/certs/server.key
      # 开启 HTTP 80 端口自动重定向至 HTTPS 443
      - HTTP_REDIRECT_PORT=80
    ports:
      # HTTPS 安全主入口 (网页 + WebSocket 均通过 443 加密传输)
      - "443:443"
      # HTTP 80 端口 (自动 301 重定向到 443 HTTPS)
      - "80:80"
    volumes:
      # 1. 宿主机数据持久化卷 (频道击杀历史、接单状态、审计日志均持久化在 ./data)
      - ./data:/app/data
      # 2. SSL 证书目录挂载 (放入 server.crt 与 server.key 即可)
      - ./certs:/app/certs:ro
